<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Candle Runner</title>
<link rel="stylesheet" href="fonts/fonts.css?v=2">
<style>
html,body{height:100%;margin:0;padding:0;background:#000;color-scheme:dark;overflow:hidden}
body{font:14px system-ui,sans-serif}
</style></head><body>
<div id="probe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>
<style>
/* Layout: one full-height stage holding a canvas; the game scales to fit and never scrolls */
:root{
  --bg:#05080a; --panel:#0d1316; --fg:#e6edf0; --mute:#7d8b92;
  --up:#18d68a; --down:#ff4d5e; --gold:#e3b341;
  --head:"Saira Condensed","Arial Narrow",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);padding-inline:16px;padding-block:12px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.stage{height:100%;max-width:1100px;margin:0 auto;position:relative;border-radius:18px;overflow:hidden;border:1px solid #1c2429;background:#05080a}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:3}
.tools button,.panel button{background:#0d1316cc;color:var(--fg);border:1px solid #1c2429;border-radius:10px;padding:6px 10px;font:600 12px var(--mono);cursor:pointer}
.tools button:focus-visible,.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{position:absolute;top:48px;right:10px;width:min(380px,calc(100% - 20px));max-height:calc(100% - 64px);overflow:auto;background:#0b1013f4;border:1px solid #1c2429;border-radius:14px;padding:14px;z-index:4;font:500 12px var(--mono)}
.panel[hidden]{display:none}
.ph{font:800 18px var(--head);letter-spacing:.04em;margin-bottom:6px}
.pn{color:var(--mute);margin:0 0 10px;line-height:1.5}
.pr{display:grid;gap:4px;padding:8px 0;border-top:1px solid #1c2429;min-width:0}
.pr label{font-weight:700;color:var(--gold)}
.pr input[type=file]{max-width:100%;color:var(--mute);font:500 11px var(--mono)}
.pl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ps{color:var(--mute);margin-right:auto}
.pc{margin-top:10px;width:100%}
</style>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="Candle Runner game. Press space or tap to jump."></canvas>
  <div class="tools"><button id="snds" type="button" aria-expanded="false">SOUNDS</button><button id="snd" type="button" aria-pressed="true">SOUND ON</button></div>
  <div class="panel" id="panel" hidden></div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),sndBtn=document.getElementById('snd');
var HEAD="'Saira Condensed','Arial Narrow',sans-serif",MONO="'JetBrains Mono',Consolas,monospace";
var UP='#18d68a',DN='#ff4d5e',GOLD='#e3b341',FG='#e6edf0',MUTE='#7d8b92';
var VW=800,VH=640,SC=1,CW=34,R=12;
var DAYLEN=110,CLOSEDW=5,WEEKENDW=6,HITC=10,MINBAL=50,AD_REWARD=20,K=2,SLD=88,TPD=130,P0=2560,PPX=.12;

/* ---------- audio (all synthesized) ---------- */
var AC=null,master,sfxBus,musBus,verb,muted=false,musicOn=false,nextStep=0,stepN=0,sched=null;
function impulse(sec,decay){
  var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);
  for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}
  return b;
}
function initAudio(){
  if(AC)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext; AC=new C();
    master=AC.createGain(); master.gain.value=muted?0:.85; master.connect(AC.destination);
    sfxBus=AC.createGain(); sfxBus.gain.value=1; sfxBus.connect(master);
    musBus=AC.createGain(); musBus.gain.value=.3; musBus.connect(master);
    verb=AC.createConvolver(); verb.buffer=impulse(3.2,2.4); verb.connect(master);
    var vs=AC.createGain(); vs.gain.value=.16; sfxBus.connect(vs); vs.connect(verb);
    var vm=AC.createGain(); vm.gain.value=.7; musBus.connect(vm); vm.connect(verb);
  }catch(e){AC=null;}
  if(AC)loadSnds();
}
function tone(f,t,d,type,v,slide,bus){
  if(!AC)return; var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+t;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v||.2,t0+.006); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g); g.connect(bus||sfxBus); o.start(t0); o.stop(t0+d+.03);
}
var noiseBuf=null;
function getNoise(){
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var a=noiseBuf.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  return noiseBuf;
}
function noiseAt(t,d,v,ft,ff,bus,ff2){
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=getNoise();s.loop=true;f.type=ft||'lowpass';f.frequency.setValueAtTime(ff||1000,t);
  if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t);s.stop(t+d+.03);
}
function noise(t,d,v,ft,ff,ff2){if(AC)noiseAt(AC.currentTime+t,d,v,ft,ff,sfxBus,ff2);}
var SFX={
  /* order filled: one crisp two-note terminal blip, used for every open / TP / SL / close */
  /* order filled: short soft terminal 'ok' blip, a tight cluster of partials around 460-650 Hz */
  filled:function(){
    [458,529,590,652].forEach(function(f,i){tone(f,0,.2,'sine',.24-.04*i);});
    tone(916,0,.09,'sine',.05);noise(0,.012,.08,'highpass',3000);
  },
  jump:function(){tone(220,0,.13,'sine',.18,430);noise(0,.1,.05,'bandpass',700,1800);},
  dbl:function(){tone(330,0,.11,'sine',.16,640);noise(0,.08,.04,'bandpass',1200,3000);},
  land:function(){noise(0,.07,.08,'lowpass',600);tone(70,0,.08,'sine',.12,45);},
  coin:function(){tone(608,0,.1,'sine',.14);tone(694,.012,.09,'sine',.1);noise(0,.012,.1,'highpass',2500);},
  news:function(){noise(0,.4,.25,'highpass',500,9000);tone(80,.32,1.0,'sine',.6,28);tone(880,.34,.12,'square',.13);tone(660,.5,.12,'square',.13);tone(880,.66,.12,'square',.12);noise(.32,.8,.35,'lowpass',1400,100);},
  hit:function(){tone(95,0,.6,'sine',.55,32);tone(58,0,.7,'sawtooth',.16,38);noise(0,.35,.4,'lowpass',700,120);},
  fall:function(){tone(260,0,1.0,'sine',.22,42);noise(.05,.7,.12,'lowpass',500,100);},
  chime:function(){tone(196,0,2.4,'sine',.2);tone(293.7,.02,2.2,'sine',.1);tone(587,.04,1.8,'sine',.05);noise(0,.5,.05,'lowpass',400);},
  bell:function(){tone(220,0,1.2,'triangle',.15);tone(329.6,.14,1.4,'triangle',.16);tone(440,.28,1.6,'triangle',.14);tone(61,0,.9,'sine',.3,45);},
  call:function(){tone(62,0,1.8,'sawtooth',.34,26);tone(55,0,1.8,'sine',.5,24);tone(466,0,1.6,'sawtooth',.12,233);tone(329.6,0,1.6,'sawtooth',.1,164);noise(0,1.6,.3,'lowpass',2000,90);},
  levelup:function(){[293.7,349.2,440,587.3].forEach(function(f,i){tone(f,i*.09,1.0,'triangle',.16);tone(f/2,i*.09,1.0,'sine',.1);});tone(73.4,0,1.3,'sine',.4,50);noise(0,.6,.07,'highpass',4000,9000);},
  start:function(){tone(73.4,0,1.2,'sine',.4,50);tone(146.8,.05,1.6,'sawtooth',.06);noise(0,.9,.12,'highpass',500,5000);}
};
var custom={},SLOTS=[['filled','Order filled (buy, sell, TP, SL)'],['coin','Coin pickup'],['hit','Hit or fall'],['news','News release'],['market','Market open and close']];
var SLOTMAP={filled:'filled',coin:'coin',hit:'hit',fall:'hit',news:'news',chime:'market',bell:'market'};
function playBuf(b){var s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=.9;s.connect(g);g.connect(sfxBus);s.start();}
function sfx(n){
  if(!AC||muted)return;
  var sl=SLOTMAP[n];if(sl&&custom[sl]){playBuf(custom[sl]);return;}
  if(SFX[n])SFX[n]();
}
function idb(cb){try{var r=indexedDB.open('cr-sounds',1);r.onupgradeneeded=function(){r.result.createObjectStore('snd');};r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function saveSnd(slot,buf){idb(function(db){if(!db)return;try{var st=db.transaction('snd','readwrite').objectStore('snd');if(buf)st.put(buf,slot);else st.delete(slot);}catch(e){}});}
function loadSnds(){idb(function(db){if(!db||!AC)return;try{var st=db.transaction('snd','readonly').objectStore('snd');SLOTS.forEach(function(sl){var q=st.get(sl[0]);q.onsuccess=function(){if(q.result)AC.decodeAudioData(q.result.slice(0),function(b){custom[sl[0]]=b;refreshPanel();},function(){});};});}catch(e){}});}

/* ---------- music: original dark cinematic cue (96 bpm, D minor) ---------- */
var stepDur=60/96/4;
function bpmNow(){var sp=(G.mode==='play')?G.speed:175;return Math.max(70,Math.min(122,70+(sp-175)*.14));}
var ROOTS=[73.42,58.27,49,55],QUAL=[1.1892,1.2599,1.1892,1.2599],P5=1.4983;
function padNote(f,t,dur,vol,lp){
  var o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o2.type='sawtooth';o.frequency.value=f;o2.frequency.value=f*1.007;fl.type='lowpass';fl.frequency.value=lp;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.linearRampToValueAtTime(.0001,t+dur);
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(musBus);o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
}
function strings(f,t,dur,vol){
  var o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),fl=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=f;l.frequency.value=5.2;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);
  fl.type='lowpass';fl.frequency.value=2600;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.5);g.gain.linearRampToValueAtTime(.0001,t+dur);
  o.connect(fl);fl.connect(g);g.connect(musBus);o.start(t);l.start(t);o.stop(t+dur+.1);l.stop(t+dur+.1);
}
function boom(t,vol){
  var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(34,t+.35);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(musBus);o.start(t);o.stop(t+1);
  noiseAt(t,.5,vol*.35,'lowpass',300,musBus);
}
function stepAt(t,s){
  var barIdx=Math.floor(s/16),k=s%16,chord=Math.floor(barIdx/2)%4,r=ROOTS[chord],m3=QUAL[chord];
  var inten=.5;
  if(G.mode==='play')inten=.55+Math.min(1,(G.speed-175)/245)*.35+(G.positions.length?.25:0);
  if(k%2===0)noiseAt(t,.03,.07*inten,'highpass',5500,musBus);
  if(k===0)boom(t,.8);
  if(barIdx%2===1&&(k===8||k===14))boom(t,.35);
  if(k%2===0){
    var seq=[1,2,P5,2,1,2,m3*2,P5],f=r*2*seq[(k/2)|0];
    var o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(900+inten*700,t);fl.frequency.exponentialRampToValueAtTime(180,t+.2);
    g.gain.setValueAtTime(.2*inten,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(fl);fl.connect(g);g.connect(musBus);o.start(t);o.stop(t+.25);
  }
  if(k===0&&barIdx%2===0){
    var d=stepDur*32;
    padNote(r*2,t,d,.07,700);padNote(r*2*m3,t,d,.06,700);padNote(r*2*P5,t,d,.06,700);padNote(r*4,t,d,.04,900);
    var o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.value=r;g2.gain.setValueAtTime(.0001,t);g2.gain.linearRampToValueAtTime(.32,t+d*.3);g2.gain.linearRampToValueAtTime(.0001,t+d);o2.connect(g2);g2.connect(musBus);o2.start(t);o2.stop(t+d+.1);
  }
  if(k===0&&barIdx%4===3)strings(r*8*1.4142,t,5.5,.035);
  if(k===0&&barIdx%4===1)strings(r*8*1.0595,t,4.5,.03);
  if(k===0&&barIdx%8===7){
    noiseAt(t,2.9,.16,'highpass',300,musBus,7000);
    var o3=AC.createOscillator(),g3=AC.createGain();o3.type='sine';o3.frequency.setValueAtTime(180,t);o3.frequency.exponentialRampToValueAtTime(900,t+2.9);
    g3.gain.setValueAtTime(.0001,t);g3.gain.linearRampToValueAtTime(.06,t+2.6);g3.gain.linearRampToValueAtTime(.0001,t+2.95);o3.connect(g3);g3.connect(musBus);o3.start(t);o3.stop(t+3);
  }
}
function musicStart(){
  if(!AC||musicOn)return; musicOn=true; nextStep=AC.currentTime+.08; stepN=0;
  sched=setInterval(function(){if(!AC)return;while(nextStep<AC.currentTime+.2){stepDur=60/bpmNow()/4;stepAt(nextStep,stepN);nextStep+=stepDur;stepN++;}},30);
}
function musicStop(){musicOn=false;if(sched){clearInterval(sched);sched=null;}}
function setMuted(m){
  muted=m; sndBtn.textContent=m?'SOUND OFF':'SOUND ON'; sndBtn.setAttribute('aria-pressed',String(!m));
  if(master)master.gain.value=m?0:.85;
  try{localStorage.setItem('cr-muted',m?'1':'0');}catch(e){}
}
try{if(localStorage.getItem('cr-muted')==='1')muted=true;}catch(e){}
sndBtn.textContent=muted?'SOUND OFF':'SOUND ON'; sndBtn.setAttribute('aria-pressed',String(!muted));
sndBtn.addEventListener('click',function(e){e.stopPropagation();initAudio();setMuted(!muted);if(!muted&&G.mode==='play')musicStart();});
sndBtn.addEventListener('pointerdown',function(e){e.stopPropagation();});

/* ---------- custom sounds panel: use your own audio files, kept in this browser ---------- */
var panel=document.getElementById('panel'),snds=document.getElementById('snds'),rowEls={};
function refreshPanel(){SLOTS.forEach(function(sl){var r=rowEls[sl[0]];if(r)r.status.textContent=custom[sl[0]]?'custom file loaded':'built in';});}
function buildPanel(){
  var h=document.createElement('div');h.className='ph';h.textContent='Custom sounds';panel.appendChild(h);
  var note=document.createElement('p');note.className='pn';note.textContent='Pick your own audio files, for example the ones in your MetaTrader 5 Sounds folder (ok.wav, stops.wav, tick.wav). They stay on this device only.';panel.appendChild(note);
  SLOTS.forEach(function(sl){
    var row=document.createElement('div');row.className='pr';
    var lab=document.createElement('label');lab.textContent=sl[1];lab.setAttribute('for','snd-'+sl[0]);
    var inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.id='snd-'+sl[0];
    var st=document.createElement('span');st.className='ps';st.textContent='built in';
    var test=document.createElement('button');test.type='button';test.textContent='Test';
    var rst=document.createElement('button');rst.type='button';rst.textContent='Reset';
    rowEls[sl[0]]={status:st};
    inp.addEventListener('change',function(){
      var f=inp.files&&inp.files[0];if(!f)return;initAudio();if(!AC){st.textContent='audio not available';return;}
      var rd=new FileReader();
      rd.onload=function(){
        var buf=rd.result;
        AC.decodeAudioData(buf.slice(0),function(b){custom[sl[0]]=b;saveSnd(sl[0],buf);refreshPanel();playBuf(b);},function(){st.textContent='could not read this file';});
      };
      rd.readAsArrayBuffer(f);
    });
    test.addEventListener('click',function(){initAudio();if(AC&&AC.state==='suspended')AC.resume();var was=muted;muted=false;sfx(sl[0]==='market'?'chime':sl[0]);muted=was;});
    rst.addEventListener('click',function(){delete custom[sl[0]];saveSnd(sl[0],null);inp.value='';refreshPanel();});
    row.appendChild(lab);row.appendChild(inp);var line=document.createElement('div');line.className='pl';line.appendChild(st);line.appendChild(test);line.appendChild(rst);row.appendChild(line);panel.appendChild(row);
  });
  var close=document.createElement('button');close.type='button';close.className='pc';close.textContent='Done';close.addEventListener('click',function(){togglePanel(false);});panel.appendChild(close);
}
function togglePanel(open){
  if(open===undefined)open=panel.hidden;
  panel.hidden=!open;snds.setAttribute('aria-expanded',String(open));
  if(open&&G.mode==='play')G.pause=true;
}
buildPanel();
snds.addEventListener('click',function(e){e.stopPropagation();togglePanel();});
snds.addEventListener('pointerdown',function(e){e.stopPropagation();});
panel.addEventListener('pointerdown',function(e){e.stopPropagation();});
panel.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Escape')togglePanel(false);});

/* ---------- state ---------- */
var best=0; try{best=parseInt(localStorage.getItem('cr-best5')||'0',10)||0;}catch(e){}
var START_BAL=500;
function loadAcct(){try{var v=parseFloat(localStorage.getItem('cr-acct4'));if(isFinite(v)&&v>=0)return v;}catch(e){}return START_BAL;}
var PROG=(function(){try{var o=JSON.parse(localStorage.getItem('cr-prog3'));if(o&&o.l>=1)return {l:o.l|0,x:+o.x||0};}catch(e){}return {l:1,x:0};})();
var G={mode:'menu',scroll:0,speed:300,balance:loadAcct(),runStart:0,margin:3,wallet:20,deadReason:'',lvBannerT:0,ad:null,ins:{l:0,r:0,t:0,b:0},adMsg:null,adBtn:null,revived:false,restarts:0,reviveBtn:null,topBtn:null,dblBtn:null,dblAmount:0,adCancel:null,dayW:0,dayL:0,weekW:0,weekL:0,weekStartBal:500,emote:null,react:null,intro:null,dist:0,t:0,shake:0,invuln:0,cam:0,lastSurf:0,
  px:0,y:0,vy:0,grounded:true,jumps:0,coyote:0,buffer:0,dead:0,pause:false,newBest:false,penalty:0,saveT:0,
  positions:[],unreal:0,nid:0,level:PROG.l,xp:PROG.x,dayStartBal:5000,spin:0,jumped:false,fade:0,fadeDir:0,pending:false,dustT:0,wd:0,week:1,newsToday:false,newsName:'',newsFired:false,flash:0,newsBar:null,evCol:-1,closeBtn:null,resetBtn:null,reg:'range',dc:0,deposit:false};
function saveAcct(){try{localStorage.setItem('cr-acct4',G.balance.toFixed(2));localStorage.setItem('cr-prog3',JSON.stringify({l:G.level,x:Math.round(G.xp)}));if(G.mode!=='menu')localStorage.setItem('cr-px2',priceOf(G.lastSurf).toFixed(1));}catch(e){}}
function loadPx(){try{var v=parseFloat(localStorage.getItem('cr-px2'));if(isFinite(v)&&v>1200&&v<12000)return v;}catch(e){}return 2560;}
var cols=[],gen={},trail=[],parts=[],pops=[],banner=null;
function rnd(a,b){return a+Math.random()*(b-a);}
function baseY(){return VH*.64;}
function resize(){
  var r=stage.getBoundingClientRect(),w=Math.max(200,r.width),h=Math.max(200,r.height),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  SC=h/640; if(w/SC<520)SC=w/520; VW=w/SC;VH=h/SC;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
  G.px=VW*.24;
  var pr=document.getElementById('probe');
  if(pr){var cs=getComputedStyle(pr);G.ins={l:(parseFloat(cs.paddingLeft)||0)/SC,r:(parseFloat(cs.paddingRight)||0)/SC,t:(parseFloat(cs.paddingTop)||0)/SC,b:(parseFloat(cs.paddingBottom)||0)/SC};}
}
window.addEventListener('resize',resize);
function priceOf(y){return P0-y*PPX;}
P0=loadPx();

/* ---------- world generation: real candles, strong trends, weekdays, news days, weekend gaps ---------- */
var DAYS=['MON','TUE','WED','THU','FRI'];
function newRegime(){
  var r=Math.random(),type=r<.45?'up':r<.77?'down':'range';
  gen.reg={type:type,left:Math.floor(rnd(26,48))};
}
function setupDay(){
  // news every Wednesday and Friday, now and then on Monday or Tuesday
  var wd=gen.wd,nm='';
  if(wd===2)nm='FOMC';else if(wd===4)nm='NFP';else if(wd===1&&Math.random()<.35)nm='CPI';else if(wd===0&&Math.random()<.25)nm='PMI';
  gen.newsToday=nm!=='';gen.newsName=nm;
  gen.newsCol=gen.newsToday?Math.floor(rnd(40,70)):-1;
}
function resetWorld(){
  cols=[];trail=[];parts=[];pops=[];banner=null;
  gen={runDay:1,price:0,sinceObst:8,sincePick:14,coinRun:0,dayCol:0,closing:0,closingW:CLOSEDW,wd:0,week:1,reg:null,pairLeft:0,pair:null,pairSecond:1,pairNews:null,openNext:false,newsToday:false,newsName:'',newsCol:-1};
  newRegime();gen.reg.type='up';setupDay();
}
function graceCols(){
  var di=gen.runDay;
  return di===1?30:di===2?22:di===3?16:0;
}
function candle(c,step){
  var o=gen.price,cl=o+step;
  c.o=o;c.cl=cl;c.off=Math.min(o,cl);c.up=cl<=o;
  c.hi=c.off-rnd(3,15);c.lo=Math.max(o,cl)+rnd(3,15);
  gen.price=cl;
}
function genCol(i){
  var c={i:i,kind:'ground',off:0,o:0,cl:0,hi:0,lo:0,up:true,obst:0,coins:[],picks:null,wd:gen.wd,week:gen.week,dc:gen.dayCol,reg:gen.reg.type,
    dayStart:false,closedFirst:false,weekend:false,weekendGap:false,gapPts:0,gapDir:0,news:'',newsToday:gen.newsToday,newsName:gen.newsName};
  if(i<8){candle(c,rnd(-3,3));c.reg='range';cols[i]=c;gen.dayCol++;return;}
  if(gen.closing>0){
    c.kind='closed';c.closedFirst=(gen.closing===gen.closingW);if(c.closedFirst)c.span=gen.closingW;c.weekend=(gen.wd===4);c.reg='range';c.off=gen.price;
    var k=gen.closingW-gen.closing;c.coins.push({dy:-84-Math.sin((k+.5)/gen.closingW*Math.PI)*60,taken:false});
    gen.closing--;if(gen.closing===0)gen.openNext=true;
    cols[i]=c;return;
  }
  if(gen.openNext){
    gen.openNext=false;gen.runDay++;gen.wd=(gen.wd+1)%5;newRegime();
    var isMon=gen.wd===0;if(isMon)gen.week++;
    var dir=Math.random()<.5?-1:1,mag;
    if(isMon)mag=dir>0?rnd(80,130):rnd(90,150);else mag=dir>0?rnd(8,26):rnd(8,30);
    gen.price+=dir>0?-mag:mag;gen.dayCol=0;setupDay();
    c.dayStart=true;c.weekendGap=isMon;c.gapPts=mag*PPX;c.gapDir=dir;c.wd=gen.wd;c.week=gen.week;c.dc=0;c.newsToday=gen.newsToday;c.newsName=gen.newsName;
    gen.sinceObst=0;gen.sincePick=8;
  }
  var mean=gen.reg.type==='up'?-11:gen.reg.type==='down'?11:0;
  var step=Math.max(-40,Math.min(40,mean+rnd(-13,13)));
  candle(c,step);c.reg=gen.reg.type;
  if(--gen.reg.left<=0&&!c.dayStart)newRegime();
  gen.dayCol++;gen.sinceObst++;gen.sincePick++;
  if(gen.dayCol>=DAYLEN){var jd=(G.speed||175)*1.2;gen.closingW=Math.max(3,Math.min(5,Math.round(.55*jd/CW)))+(gen.wd===4?1:0);gen.closing=gen.closingW;}
  var busy=false;
  if(gen.pairLeft>0){
    gen.pairLeft--;busy=true;
    if(gen.pairLeft===0)c.picks=[{dir:gen.pairSecond,dy:-88,taken:false,pair:gen.pair,nw:gen.pairNews}];
  }
  var pO=gen.newsToday?(.11+Math.min(.05,(G.dist||0)/25000)):0;
  var gc=graceCols(),inGrace=gen.dayCol<=gc;
  var forced=!busy&&gen.newsCol>=0&&gen.dayCol>=gen.newsCol&&gen.sincePick>=12;
  if(forced){
    gen.newsCol=-1;
    var f1=Math.random()<.5?1:-1;gen.pair={done:false};gen.pairSecond=-f1;gen.pairLeft=5;gen.sincePick=0;gen.pairNews=gen.newsName;
    c.picks=[{dir:f1,dy:-88,taken:false,pair:gen.pair,nw:gen.newsName}];
  }else if(inGrace&&gen.dayCol%14>=6&&gen.dayCol%14<=8&&!busy){
    c.coins.push({dy:[-58,-84,-58][gen.dayCol%14-6],taken:false});
  }else if(!busy&&!inGrace&&!c.dayStart&&gen.sinceObst>=8&&Math.random()<pO){
    c.obst=rnd(60,92);gen.sinceObst=0;c.coins.push({dy:-(c.obst+34),taken:false});
  }else if(!busy&&!c.dayStart&&gen.sincePick>16&&gen.dayCol>8&&gen.dayCol<DAYLEN-24&&Math.random()<.14){
    var first=Math.random()<.5?1:-1;gen.pair={done:false};gen.pairSecond=-first;gen.pairLeft=5;gen.sincePick=0;gen.pairNews=null;
    c.picks=[{dir:first,dy:-88,taken:false,pair:gen.pair,nw:null}];
  }else if(!busy&&gen.coinRun>0){c.coins.push({dy:-26,taken:false});gen.coinRun--;}
  else if(!busy&&Math.random()<.06&&gen.sinceObst>3){gen.coinRun=Math.floor(rnd(4,8));c.coins.push({dy:-26,taken:false});}
  cols[i]=c;
}
function ensure(){var need=Math.floor((G.scroll+VW)/CW)+10;for(var i=cols.length;i<=need;i++)genCol(i);}
function colAt(wx){return cols[Math.floor(wx/CW)]||null;}
function surfAt(wx){var c=colAt(wx);if(!c||c.kind==='closed')return null;return c.off;}
/* news release: three huge candles appear right in front of the player, everything after is shifted */
function injectNews(pc,name,sd){
  var j=pc+3,M=rnd(190,260),parts3=[.42*M,.24*M,-.16*M,.14*M,-.07*M,.09*M],sh=0,k=0;
  ensure();
  for(var idx=j;idx<cols.length;idx++){
    var c=cols[idx];if(!c)break;
    if(k<6&&c.kind==='ground'){
      var oldcl=c.cl;c.o+=sh;c.cl=c.o-sd*parts3[k];sh=c.cl-oldcl;
      c.off=Math.min(c.o,c.cl);c.up=c.cl<=c.o;var wk=k<2?rnd(26,52):rnd(10,24);c.hi=c.off-wk;c.lo=Math.max(c.o,c.cl)+wk*rnd(.6,1.2);
      c.obst=0;c.coins=[];c.picks=null;c.news=name;k++;
    }else if(c.kind!=='closed'){c.o+=sh;c.cl+=sh;c.hi+=sh;c.lo+=sh;c.off+=sh;}
    else c.off+=sh;
  }
  gen.price+=sh;gen.reg={type:sd>0?'up':'down',left:6};gen.sinceObst=-8;
}

function steam(x,y,sc,tt){

function reactionScene(cx,fy,sc,mood,tt){

    confetti(cx,fy-110*sc/3,130*sc/3,140*sc/3,tt);

function update(dt,rdt){
  var rd=rdt||dt;
  G.t+=dt;
  if(G.ad){G.ad.t+=rd;if(G.ad.native){if(!G.ad.shown&&G.ad.t>25)nativeEnd(true);}else if(G.ad.t>=G.ad.dur){var ak=G.ad.kind,am=G.ad.amount;G.ad=null;finishAd(ak,true,am);}}

  if(G.lvBannerT>0){G.lvBannerT-=dt;if(G.lvBannerT<=0){sfx('levelup');burst(G.px,G.y-30,GOLD,30,300);showBanner('LEVEL '+G.level,GOLD,lvName().toUpperCase()+'   lot '+lotSize().toFixed(2)+'   a faster pace');}}
  if(G.fadeDir!==0){
    G.fade+=G.fadeDir*dt*(G.fadeDir>0?5:3.2);
    if(G.fade>=1){G.fade=1;if(G.pending){respawn();G.pending=false;}G.fadeDir=-1;}
    else if(G.fade<=0){G.fade=0;G.fadeDir=0;}
  }
  if(G.mode==='intro'){updIntro(dt);return;}
  if(G.mode==='name')return;
  if(G.mode==='menu'){G.scroll+=60*dt;ensure();var sm=surfAt(G.scroll+G.px);if(sm!==null){G.lastSurf=sm;G.cam+=(sm-G.cam)*Math.min(1,dt*2.5);}return;}
  if(G.pause)return;
  if(G.mode==='dead'){G.dead+=dt;G.shake=Math.max(0,G.shake-dt);updFx(dt);return;}
  G.speed=Math.min(420,175+Math.min(50,G.t*.45)+18*Math.min(G.level-1,8)+8*Math.max(0,G.level-9));G.scroll+=G.speed*dt;G.dist+=G.speed*dt/40;
  ensure();
  G.saveT+=dt;if(G.saveT>2){G.saveT=0;saveAcct();}
  if(G.invuln>0)G.invuln-=dt;
  if(G.shake>0)G.shake-=dt;
  if(G.spin>0)G.spin-=dt;
  G.dustT=(G.dustT||0)-dt;
  if(G.grounded&&G.dustT<=0){G.dustT=.07;parts.push({x:G.px-6,y:G.y+R-1,vx:-rnd(30,80),vy:-rnd(5,35),life:.32,t:0,col:'#8fa0a7',sz:2.2});}
  G.buffer=Math.max(0,G.buffer-dt);
  var wx=G.scroll+G.px,s=surfAt(wx),col=colAt(wx);
  if(s!==null)G.lastSurf=s;
  if(col){G.reg=col.reg;G.dc=col.dc;if(col.kind==='ground'){G.wd=col.wd;G.week=col.week;G.newsToday=col.newsToday;G.newsName=col.newsName;}}
  var camT=G.lastSurf;
  if(col){var ss=0,sn=0;for(var kk=0;kk<6;kk++){var c2=cols[col.i+kk];if(c2){ss+=c2.off;sn++;}}if(sn)camT=G.lastSurf*.5+(ss/sn)*.5;}
  G.cam+=(camT-G.cam)*Math.min(1,dt*3.2);
  // session events
  if(col&&col.i>G.evCol){
    if(col.closedFirst){
      G.evCol=col.i;var dp=0,nOpen=G.positions.length;
      if(nOpen)dp=closeAll('day',true);
      var tot=G.balance-G.dayStartBal;
      sfx('chime');showBanner(col.weekend?'WEEKEND':'MARKET CLOSED',tot>=0?GOLD:DN,DAYS[col.wd]+' result '+fmtS(tot)+(nOpen?'  ('+nOpen+' open trade'+(nOpen>1?'s':'')+' closed '+fmtS(dp)+')':''));saveAcct();
      showReact(col.weekend?G.balance-G.weekStartBal:tot,col.weekend?G.weekW:G.dayW,col.weekend?G.weekL:G.dayL,col.weekend);
      if(col.weekend)levelUp();
    }else if(col.dayStart){
      G.evCol=col.i;G.dayStartBal=G.balance;G.newsFired=false;G.dayW=G.dayL=0;if(col.wd===0){G.weekW=G.weekL=0;G.weekStartBal=G.balance;}
      sfx('bell');
      showBanner(col.weekendGap?'MONDAY OPEN':'MARKET OPEN',col.gapDir>0?UP:DN,DAYS[col.wd]+'   '+(col.weekendGap?'WEEKEND ':'')+'GAP '+(col.gapDir>0?'UP +':'DOWN -')+col.gapPts.toFixed(1));
      if(col.weekendGap){G.shake=.5;G.flash=.4;}
      burst(G.px,G.y-20,col.gapDir>0?UP:DN,18,260);
    }else if(col.kind==='ground')G.evCol=col.i;
  }
  // positions: each has its own SL / TP; live P&L is the sum
  G.positions.slice().forEach(function(p){
    var cy=G.lastSurf;
    if((p.dir>0&&cy>=p.slY)||(p.dir<0&&cy<=p.slY))closePos(p,'sl');
    else if((p.dir>0&&cy<=p.tpY)||(p.dir<0&&cy>=p.tpY))closePos(p,'tp');
  });
  G.unreal=totalUnreal();
  if(G.mode==='play'&&G.balance+G.unreal<MINBAL){endRun('equity');return;}
  if(G.grounded){
    if(s===null){G.grounded=false;G.coyote=.08;G.jumps=1;}
    else{
      var tgt=s-R;
      if(tgt<G.y)G.y+=(tgt-G.y)*Math.min(1,dt*(G.y-tgt>40?12:28));
      else if(tgt>G.y+5){
        if(tgt-G.y<=40)G.y+=(tgt-G.y)*Math.min(1,dt*30);
        else{G.grounded=false;G.coyote=.08;G.jumps=1;}
      }else G.y=tgt;
    }
  }
  if(!G.grounded){
    if(G.coyote>0)G.coyote-=dt;
    G.vy+=2400*dt;G.y+=G.vy*dt;
    var feet=G.y+R,land=(G.vy>0&&s!==null&&feet>=s-2&&feet<=s+Math.max(22,G.vy*dt+6))||(G.vy>=0&&s!==null&&feet>s+22&&feet<s+200);
    if(land){
      var hard=G.vy>500;G.y=s-R;G.vy=0;G.grounded=true;G.jumps=0;
      if(hard){sfx('land');burst(G.px,s,'#8fa0a7',4,90);}

  }
  // coins and BUY / SELL tokens
  for(var j=Math.floor((wx-40)/CW);j<=Math.floor((wx+40)/CW);j++){
    var cl=cols[j];if(!cl)continue;var sy=cl.off,cxw=cl.i*CW+CW/2;

    if(cl.picks){
      for(var q=0;q<cl.picks.length;q++){var pk=cl.picks[q];if(pk.taken||(pk.pair&&pk.pair.done))continue;

function inRect(e,b,pad){
  var r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/SC,ly=(e.clientY-r.top)/SC;
  return lx>=b.x-pad&&lx<=b.x+b.w+pad&&ly>=b.y-pad&&ly<=b.y+b.h+pad;
}
function press(e){
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(G.mode==='intro'){introPress();return;}
  if(G.mode==='name'){if(e&&G.nameBtn&&inRect(e,G.nameBtn,8))confirmName();return;}
  if(G.ad){if(e&&G.adCancel&&G.ad.t>=G.ad.skipAt&&inRect(e,G.adCancel,8))skipAd();return;}
  if(G.pause){G.pause=false;return;}
  if(G.mode==='menu'){
    if(e&&G.nameLink&&inRect(e,G.nameLink,6)){enterName();return;}
    if(e&&G.resetBtn&&inRect(e,G.resetBtn,4)){startAd('reset');return;}
    if(G.balance<MINBAL){startAd();return;}
    startGame();return;
  }
  if(G.mode==='dead'){
    if(G.dead>.9){
      if(e&&G.reviveBtn&&inRect(e,G.reviveBtn,6)){startAd('revive');return;}
      if(e&&G.topBtn&&inRect(e,G.topBtn,6)){startAd();return;}
      if(G.balance<MINBAL){startAd();return;}
      G.restarts=(G.restarts||0)+1;
      if(G.restarts%3===0)startAd('inter');else startGame();
    }
    return;
  }
  if(e&&G.dblBtn&&G.react&&G.react.week&&G.react.pnl>0&&!G.react.doubled&&inRect(e,G.dblBtn,6)){G.dblAmount=G.react.pnl;startAd('double',G.react.pnl);return;}
  if(e&&G.closeBtn&&G.positions.length&&inRect(e,G.closeBtn,6)){closeAll('manual');return;}
  jump();
}
function release(){if(G.mode==='play'&&G.vy<-380)G.vy*=.5;}

  if(G.mode==='name')return;

  else if(e.code==='KeyC'){if(G.mode==='play'&&!G.pause&&G.positions.length)closeAll('manual');}
  else if(e.code==='KeyR'){if(G.mode==='menu'&&!G.ad)startAd('reset');}
  else if(e.code==='KeyA'){if((G.mode==='menu'||G.mode==='dead')&&G.balance<MINBAL&&!G.ad)startAd();}
  else if(e.code==='KeyM'){initAudio();setMuted(!muted);if(!muted&&G.mode==='play')musicStart();}
  else if(e.code==='KeyI'){if(G.mode==='menu'&&!G.ad)startIntro();}
  else if(e.code==='KeyV'){if(G.mode==='dead'&&G.deadReason==='hit'&&!G.revived&&G.balance>=MINBAL&&!G.ad&&G.dead>.9)startAd('revive');}
  else if(e.code==='KeyP'||e.code==='Escape'){if(G.mode==='intro'){if(G.intro.started&&G.intro.t>.6){musicStop();endIntro();}}else if(G.ad)skipAd();else if(G.mode==='play')G.pause=!G.pause;}
});
window.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();});
document.addEventListener('visibilitychange',function(){if(document.hidden){saveAcct();if(G.mode==='play')G.pause=true;}});
window.addEventListener('pagehide',saveAcct);
window.addEventListener('blur',function(){if(G.mode==='play')G.pause=true;});

/* ---------- loop ---------- */
var last=performance.now();
var fpsEma=16,fpsN=0,lowfx=false;
function frame(now){
  var raw=(now-last)/1000,dt=Math.min(.033,raw);last=now;
  update(dt,Math.min(raw,.5));draw();
  if(!lowfx){fpsEma+=(Math.min(raw,.2)*1000-fpsEma)*.05;if(++fpsN>90&&fpsEma>27){lowfx=true;try{Object.defineProperty(ctx,'shadowBlur',{configurable:true,get:function(){return 0;},set:function(){}});}catch(e){}}}
  requestAnimationFrame(frame);
}
try{if(localStorage.getItem('cr-intro')!=='1'){G.mode='intro';G.intro={t:0,started:false,lastStep:0,lastType:0,flags:{}};}}catch(e){}
resize();resetWorld();ensure();
if(!pname&&G.mode==='menu')enterName();
G.y=surfAt(G.scroll+G.px)-R;
function boot(){last=performance.now();requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load("800 40px 'Saira Condensed'"),document.fonts.load("700 20px 'JetBrains Mono'")]).then(boot,boot);}else boot();
window.__cr={setRS:function(v){RS=v;},G:G,update:update,draw:draw,startGame:startGame,jump:jump,cols:function(){return cols;},closeAll:closeAll,addXp:addXp,loseMargin:loseMargin,fireNews:fireNews,openPos:openPos};
})();
</script>
